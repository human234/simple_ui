# App-side settings the HMI library needs
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_LOG=y

# Display driver stack (ILI9488 over 4-wire MIPI DBI/SPI)
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y

# LVGL, rendering natively in the panel's 18-bit RGB666 mode.
# The HMI module (CONFIG_HMI) selects the widgets and fonts it needs;
# the display-specific settings stay here.
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_24=y
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_ERROR=y

# HMI library
CONFIG_HMI=y

# Optional LVGL performance overlay (debug). Use the runtime-stats CPU load
# backend, NOT the default idle-hook backend.
CONFIG_LV_USE_SYSMON=y
CONFIG_LV_USE_PERF_MONITOR=y
CONFIG_CPU_LOAD_BACKEND_RUNTIME_STATS=y