# One-command build for the HMI gauge demo using the prebuilt HMI image
# (official Zephyr developer image + STM32CubeProgrammer CLI). Works on any
# host that runs Docker (Windows via Docker Desktop with the WSL2 backend,
# Linux, macOS).
#
# The image bundles the Zephyr SDK, all build tools, and the
# STM32CubeProgrammer CLI so `west flash` works too; the west workspace (the
# directory containing zephyr/ and modules/) is mounted at /workdir.
#
# Usage (from anywhere; the sample path inside the module is used):
#   PowerShell:  $env:WORKSPACE = (Get-Location  # must be the workspace root
#   cmd:         set WORKSPACE=%CD%
#   Linux shell: export WORKSPACE=$(pwd)
#   docker compose -f modules/hmi/docker/docker-compose.yml run --rm hmi
#
# Or simply use the provided wrappers (Makefile / build.ps1 / build.cmd),
# which locate the workspace root automatically.
# Rebuild locally when needed (build context = this repo root):
#   docker build -f docker/Dockerfile -t ghcr.io/human234/hmi-build:0.1.1 .
services:
  hmi:
    image: ghcr.io/human234/hmi-build:0.1.1
    working_dir: /workdir
    init: true
    volumes:
      - ${WORKSPACE:?Set WORKSPACE to the west workspace root (the dir with zephyr/)}:/workdir
    command:
      - west
      - build
      - -b
      - nucleo_g474re
      - -p
      - always
      - modules/hmi/samples/gauge_demo