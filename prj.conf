CONFIG_MAIN_STACK_SIZE=8192

CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_LOG=y

# Display driver stack (ILI9488 over 4-wire MIPI DBI/SPI)
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y

# LVGL, rendering natively in the panel's 18-bit RGB666 mode
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_24=y
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_ERROR=y

# Widgets used by the gauge UI
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_LABEL=y

# Fonts referenced by hmi_gauge.c
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_22=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_32=y
CONFIG_LV_FONT_MONTSERRAT_38=y

# lvgl performance monitor
CONFIG_LV_USE_SYSMON=y
CONFIG_CPU_LOAD_BACKEND_RUNTIME_STATS=y
CONFIG_LV_USE_PERF_MONITOR=y
